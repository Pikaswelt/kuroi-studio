name: Issue nach Discord

on:
  issues:
    types: [opened, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Discord benachrichtigen
        env:
          WEBHOOK: ${{ secrets.DISCORD_ISSUE_WEBHOOK }}
          EVENT: ${{ github.event_name }}
          NUMBER: ${{ github.event.issue.number }}
          TITLE: ${{ github.event.issue.title }}
          URL: ${{ github.event.issue.html_url }}
          AUTHOR: ${{ github.event.issue.user.login }}
          BODY: ${{ github.event.issue.body }}
          ACTOR: ${{ github.actor }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          event = os.environ.get("EVENT", "")
          number = os.environ.get("NUMBER", "")
          title = os.environ.get("TITLE", "")
          url = os.environ.get("URL", "")
          author = os.environ.get("AUTHOR", "")
          body = os.environ.get("BODY", "")
          repo = os.environ.get("REPO", "")
          if event == "workflow_dispatch":
              number = "TEST"
              title = "Testmeldung aus GitHub Actions"
              url = f"https://github.com/{repo}/issues"
              author = os.environ.get("ACTOR", "")
              body = "Wenn du diese Nachricht siehst, kommen neue Bugmeldungen aus Kuroi Studio hier an."
          if not body:
              body = "(keine Beschreibung)"
          if len(body) > 1200:
              body = body[:1200] + "…"
          hook = os.environ.get("WEBHOOK", "")
          if not hook:
              raise SystemExit("Secret DISCORD_ISSUE_WEBHOOK fehlt")
          payload = {
              "username": "Kuroi Bugbot",
              "embeds": [{
                  "title": f"🐞 Issue #{number}: {title}",
                  "url": url,
                  "description": body,
                  "color": 15158332,
                  "fields": [
                      {"name": "Gemeldet von", "value": author or "unbekannt", "inline": True},
                      {"name": "Repository", "value": "Kuroi Studio", "inline": True},
                  ],
                  "footer": {"text": "Kuroi Studio • CrazyMine.de"},
              }],
          }
          data = json.dumps(payload).encode("utf-8")
          print("payload bytes:", len(data))
          req = urllib.request.Request(
              hook + "?wait=true",
              data=data,
              headers={"Content-Type": "application/json", "User-Agent": "Kuroi-Notify/1.0"},
              method="POST",
          )
          try:
              with urllib.request.urlopen(req) as r:
                  print("Discord:", r.status)
          except urllib.error.HTTPError as e:
              print(e.read().decode("utf-8", "replace"))
              raise
          PY

name: Issue nach Discord

on:
  issues:
    types: [opened, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Discord benachrichtigen
        env:
          BOT_TOKEN: ${{ secrets.DISCORD_AGENT_BOT_TOKEN }}
          CHANNEL: ${{ secrets.DISCORD_AGENT_CHANNEL_ID }}
          EVENT: ${{ github.event_name }}
          NUMBER: ${{ github.event.issue.number }}
          TITLE: ${{ github.event.issue.title }}
          URL: ${{ github.event.issue.html_url }}
          AUTHOR: ${{ github.event.issue.user.login }}
          BODY: ${{ github.event.issue.body }}
          ACTOR: ${{ github.actor }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          event = os.environ.get("EVENT", "")
          number = os.environ.get("NUMBER", "")
          title = os.environ.get("TITLE", "")
          url = os.environ.get("URL", "")
          author = os.environ.get("AUTHOR", "")
          body = os.environ.get("BODY", "")
          repo = os.environ.get("REPO", "")
          if event == "workflow_dispatch":
              number = "TEST"
              title = "Testmeldung aus GitHub Actions"
              url = f"https://github.com/{repo}/issues"
              author = os.environ.get("ACTOR", "")
              body = "Wenn du diese Nachricht siehst, kommen neue Bugmeldungen aus Kuroi Studio hier an."
          if not body:
              body = "(keine Beschreibung)"
          if len(body) > 3500:
              body = body[:3500] + "…"
          embed = {
              "title": ("🐞 Issue #" + number + ": " + title)[:256],
              "url": url or f"https://github.com/{repo}/issues",
              "description": ("**Gemeldet von:** " + (author or "unbekannt") + "\n\n" + body)[:4000],
              "color": 15158332,
              "footer": {"text": "Kuroi Studio • CrazyMine.de"},
          }
          token = os.environ.get("BOT_TOKEN", "")
          channel = os.environ.get("CHANNEL", "")
          if not token or not channel:
              raise SystemExit("Secrets DISCORD_AGENT_BOT_TOKEN / DISCORD_AGENT_CHANNEL_ID fehlen")
          payload = {"allowed_mentions": {"parse": []}, "embeds": [embed]}
          req = urllib.request.Request(
              f"https://discord.com/api/v10/channels/{channel}/messages",
              data=json.dumps(payload).encode("utf-8"),
              headers={"Content-Type": "application/json", "User-Agent": "Kuroi-Notify/1.0", "Authorization": "Bot " + token},
              method="POST",
          )
          try:
              with urllib.request.urlopen(req) as r:
                  print("Discord:", r.status)
          except urllib.error.HTTPError as e:
              print(e.read().decode("utf-8", "replace"))
              raise
          PY

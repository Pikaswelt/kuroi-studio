name: Issue nach Discord

on:
  issues:
    types: [opened, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Discord benachrichtigen
        env:
          WEBHOOK: ${{ secrets.DISCORD_ISSUE_WEBHOOK }}
          EVENT: ${{ github.event_name }}
          NUMBER: ${{ github.event.issue.number }}
          TITLE: ${{ github.event.issue.title }}
          URL: ${{ github.event.issue.html_url }}
          AUTHOR: ${{ github.event.issue.user.login }}
          BODY: ${{ github.event.issue.body }}
          ACTOR: ${{ github.actor }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          event = os.environ.get("EVENT", "")
          number = os.environ.get("NUMBER", "")
          title = os.environ.get("TITLE", "")
          url = os.environ.get("URL", "")
          author = os.environ.get("AUTHOR", "")
          body = os.environ.get("BODY", "")
          repo = os.environ.get("REPO", "")
          if event == "workflow_dispatch":
              content = "✅ **Testmeldung:** Neue Kuroi-Bugmeldungen kommen ab jetzt in diesem Kanal an."
          else:
              if not body:
                  body = "(keine Beschreibung)"
              content = f"🐞 **Neues Issue #{number}:** {title}\n<{url}>\n**Gemeldet von:** {author}\n\n{body}"
          if len(content) > 1900:
              content = content[:1897] + "…"
          hook = os.environ.get("WEBHOOK", "")
          if not hook:
              raise SystemExit("Secret DISCORD_ISSUE_WEBHOOK fehlt")
          payload = {"content": content, "allowed_mentions": {"parse": []}}
          req = urllib.request.Request(
              hook + "?wait=true",
              data=json.dumps(payload).encode("utf-8"),
              headers={"Content-Type": "application/json", "User-Agent": "Kuroi-Notify/1.0"},
              method="POST",
          )
          try:
              with urllib.request.urlopen(req) as r:
                  print("Discord:", r.status)
          except urllib.error.HTTPError as e:
              print(e.read().decode("utf-8", "replace"))
              raise
          PY
